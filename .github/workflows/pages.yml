name: Deploy viewer to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A Pages site is world-readable even when the repository is private, so
      # this build must never contain a real snapshot. viewer/src/graph.json is
      # gitignored and so is absent from a clean checkout, which makes the
      # viewer fall back to snapshot/graph.example.json on its own. This step
      # exists to fail loudly if that ever stops being true.
      - name: Refuse to publish a real snapshot
        run: |
          for f in viewer/src/graph.json snapshot/graph.json snapshot/source.json; do
            if [ -e "$f" ]; then
              echo "::error::$f is present in CI and would be published to a public page."
              exit 1
            fi
          done
          if [ -d snapshot/raw ]; then
            echo "::error::snapshot/raw exists in CI and would be published to a public page."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - run: npm ci
        working-directory: viewer

      - run: npm run lint
        working-directory: viewer

      - run: npm run build
        working-directory: viewer

      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
